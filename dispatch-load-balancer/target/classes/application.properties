spring.application.name=dispatch-load-balancer
server.port=${PORT:8081}

# Database: H2 in-memory by default; override with env vars for PostgreSQL
# e.g. DB_URL=jdbc:postgresql://host:5432/dispatchdb
spring.datasource.url=${DB_URL:jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Efficient batch upserts
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Print numbers like 100 instead of 1E+2
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.default-property-inclusion=non_null

# Swagger UI -> /swagger-ui/index.html , OpenAPI JSON -> /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
